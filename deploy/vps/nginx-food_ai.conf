# SmartKitchen Family — отдача HTML-отчёта по HTTP (маршрут C, VPS + nginx).
#
# Установка: install.sh --with-nginx (или вручную)
#   install -m 644 nginx-food_ai.conf /etc/nginx/sites-available/food_ai.conf
#   ln -sfn /etc/nginx/sites-available/food_ai.conf /etc/nginx/sites-enabled/food_ai.conf
#   nginx -t && systemctl reload nginx
#
# Каталог /opt/food_ai/reports принадлежит UID 10001 (пользователь контейнера),
# права 755 на каталоги и 644 на файлы — www-data читает их без дополнительных настроек.

server {
    listen 80;
    listen [::]:80;
    # Замените на свой домен; «_» означает «любой Host», т.е. доступ по IPv4 сервера.
    server_name _;

    root /opt/food_ai/reports;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/food_ai.access.log;
    error_log  /var/log/nginx/food_ai.error.log;

    # Отчёт обновляется раз в сутки — кэшировать его незачем.
    add_header Cache-Control "no-store" always;

    # Список каталога наружу не отдаём: только известные имена файлов.
    autoindex off;

    # Главная — последняя собранная страница.
    # run-report.sh пишет expiry_report.html; index.html появляется только если
    # администратор положил его в каталог отчётов сам (или добавил --html-out
    # reports/index.html в EXTRA_ARGS). Поэтому проверяем оба имени по порядку —
    # иначе сразу после install.sh главная отдаст 404.
    location = / {
        try_files /index.html /expiry_report.html =404;
    }

    # Разрешены только артефакты отчёта; всё прочее — 404.
    # Важно: nginx обходит regex-location по порядку, поэтому .md вынесен выше —
    # иначе до default_type очередь не дойдёт.
    location ~* ^/(index|expiry_report)\.md$ {
        # .md отсутствует в mime.types — без default_type браузер скачает файл как бинарный.
        default_type text/markdown;
        try_files $uri =404;
    }

    location ~* ^/(index|expiry_report)\.(html|json)$ {
        try_files $uri =404;
    }

    # Скрытые файлы и служебные пути (food_ai.env, cron.log) не должны быть доступны.
    location ~ /\. {
        deny all;
    }

    location / {
        return 404;
    }

    # --- Доступ по паролю (раскомментируйте и создайте файл) ---
    # Отчёт содержит данные о запасах заведения; если сервер торчит в интернет,
    # закройте его basic-аутентификацией:
    #   apt-get install -y apache2-utils
    #   htpasswd -c /etc/nginx/.htpasswd-food_ai <пользователь>
    # auth_basic "SmartKitchen Family";
    # auth_basic_user_file /etc/nginx/.htpasswd-food_ai;

    # --- HTTPS ---
    # После привязки домена: apt-get install -y certbot python3-certbot-nginx
    # и certbot --nginx -d your-domain.example (certbot сам добавит listen 443 ssl).
}
