[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartkitchen-family-agent"
version = "0.1.0"
description = "SmartKitchen Family deterministic CLI agent: сроки годности, отчёты, POS-источники"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["agent"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
strict_bytes = true
disallow_any_explicit = true
enable_error_code = [
    "ignore-without-code",
    "truthy-bool",
    "possibly-undefined",
    "unused-awaitable",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "B",
    "BLE",
    "TRY",
    "DTZ",
    "PLR",
    "RUF",
    "C4",
    "I",
    "PERF",
    "PTH",
    "RET",
    "SIM",
    "UP",
]
ignore = [
    # Русскоязычные строки, докстринги и комментарии: кириллица не является опечаткой.
    "RUF001",
    "RUF002",
    "RUF003",
]
