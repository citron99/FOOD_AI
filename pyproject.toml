[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartkitchen-family-agent"
version = "0.1.0"
description = "SmartKitchen Family deterministic CLI agent: сроки годности, отчёты, POS-источники"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["agent"]

[tool.mypy]
python_version = "3.11"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "BLE", "TRY", "DTZ", "PLR", "RUF"]
ignore = [
    # Русскоязычные строки, докстринги и комментарии: кириллица не является опечаткой.
    "RUF001",
    "RUF002",
    "RUF003",
    # Сообщения исключений собираются из контекста (имя продукта, путь, значение).
    "TRY003",
    # CLI-парсер и фабрики адаптеров намеренно имеют широкие сигнатуры.
    "PLR0912",
    "PLR0913",
    "PLR0915",
    # Сроки годности и --as-of — календарные даты без таймзоны.
    "DTZ011",
    "DTZ007",
]
